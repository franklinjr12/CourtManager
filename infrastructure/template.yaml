AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Court Manager serverless API and single-table data store
Parameters:
  WebAllowedOrigins:
    Type: CommaDelimitedList
    Description: Comma-separated list of web origins allowed to call the API (e.g. the production Cloudflare Pages domain https://<project>.pages.dev). No wildcard.
Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 30
Resources:
  CourtManagerTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      KeySchema:
        [
          { AttributeName: PK, KeyType: HASH },
          { AttributeName: SK, KeyType: RANGE },
        ]
      AttributeDefinitions:
        [
          { AttributeName: PK, AttributeType: S },
          { AttributeName: SK, AttributeType: S },
        ]
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../apps/api/dist/
      Handler: lambda.handler
      FunctionUrlConfig:
        {
          AuthType: NONE,
          Cors:
            {
              AllowOrigins: !Ref WebAllowedOrigins,
              AllowMethods:
                ['GET', 'POST', 'PATCH', 'PUT', 'DELETE', 'OPTIONS'],
              AllowHeaders: ['Authorization', 'Content-Type'],
            },
        }
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref CourtManagerTable
          CORS_ALLOWED_ORIGINS: !Join [',', !Ref WebAllowedOrigins]
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                [
                  dynamodb:GetItem,
                  dynamodb:PutItem,
                  dynamodb:UpdateItem,
                  dynamodb:DeleteItem,
                  dynamodb:Query,
                  dynamodb:Scan,
                  dynamodb:TransactWriteItems,
                  dynamodb:BatchGetItem,
                  dynamodb:BatchWriteItem,
                ]
              Resource: !GetAtt CourtManagerTable.Arn
Outputs:
  ApiUrl:
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
