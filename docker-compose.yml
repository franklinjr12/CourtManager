services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    user: '0:0'
    command: '-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data'
    ports:
      - '8120:8000'
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    healthcheck:
      test:
        ['CMD-SHELL', "grep -q ':1F40 ' /proc/net/tcp /proc/net/tcp6 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  dynamodb-data:
